<!DOCTYPE html>
<html>
<head>
    <title>Mood Tracker</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .emoji-btn {
            font-size: 60px;
            background: none;
            border: none;
            cursor: pointer;
            margin: 20px;
            transition: 0.3s;
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none; /* Removes underline from links */
        }
        .emoji-btn:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.2);
        }
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Keeps the 3-column layout */
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .mood-label {
            font-size: 16px;
            margin-top: -10px; /* Adjusted to sit closer to emoji */
            color: #ddd;
        }
    </style>
</head>
<body>

    <h1>How are you feeling {{ username if username else 'Friend' }}</h1>
    <p>Select your current mood to personalize the dashboard.</p>

    <div class="mood-grid">
        <div>
            <a href="/mood/happy" class="emoji-btn">😊</a>
            <div class="mood-label">Happy</div>
        </div>
        <div>
            <a href="/mood/sad" class="emoji-btn">😞</a>
            <div class="mood-label">Sad</div>
        </div>
        <div>
            <a href="/mood/stressed" class="emoji-btn">😫</a>
            <div class="mood-label">Stressed</div>
        </div>
        <div>
            <a href="/mood/calm" class="emoji-btn">😌</a>
            <div class="mood-label">Calm</div>
        </div>
        <div>
            <a href="/mood/angry" class="emoji-btn">😡</a>
            <div class="mood-label">Angry</div>
        </div>
        <div>
            <a href="/mood/anxious" class="emoji-btn">😰</a>
            <div class="mood-label">Anxiety</div>
        </div>
        <div></div> 
        <div>
            <a href="/mood/tired" class="emoji-btn">😴</a>
            <div class="mood-label">Tired</div>
        </div>
        <div>
            <a href="/mood/swings" class="emoji-btn"></a>
            <div class="mood-label">Mood Swings</div>
            <div>
            <a href="/mood/Fear" class="emoji-btn">😞</a>
            <div class="mood-label">Fear</div>
        </div>
        </div>
        <div></div>
    </div>
    <br><br>
    <button onclick="logout()" style="margin-top: 20px; padding: 10px; cursor: pointer; border-radius: 5px; border: none; background: white; color: #764ba2; font-weight: bold;">
        Logout (Switch User)
    </button>

<script>
    function logout() {
        localStorage.removeItem('loggedInUser');
        window.location.href = '/';
    }
</script>

</body>
</html>
