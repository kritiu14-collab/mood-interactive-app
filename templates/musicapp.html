<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace | Music for your Mood</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0d0d14;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animated background orbs */
        .bg-orbs {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 12s ease-in-out infinite;
        }
        .orb1 { width: 500px; height: 500px; background: #6c5ce7; top: -100px; left: -100px; animation-delay: 0s; }
        .orb2 { width: 400px; height: 400px; background: #1db954; bottom: -50px; right: -50px; animation-delay: 4s; }
        .orb3 { width: 300px; height: 300px; background: #e91e8c; top: 40%; right: 20%; animation-delay: 8s; }

        @keyframes drift {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(30px, 20px) scale(1.1); }
        }

        /* Top nav */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative; z-index: 10;
        }

        .topbar .logo { font-size: 1.2rem; font-weight: 700; color: #1db954; }
        .topbar .mood-badge {
            background: rgba(29,185,84,0.15);
            border: 1px solid rgba(29,185,84,0.3);
            color: #1db954;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
        }
        .topbar a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .topbar a:hover { color: white; }

        /* Main layout */
        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative; z-index: 1;
        }

        /* Sidebar — moods */
        .sidebar {
            width: 220px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 20px 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.3);
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .mood-btn {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 11px 14px;
            background: transparent;
            border: none; border-radius: 10px;
            color: rgba(255,255,255,0.65);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            margin-bottom: 4px;
        }

        .mood-btn:hover { background: rgba(255,255,255,0.07); color: white; }
        .mood-btn.active {
            background: linear-gradient(135deg, rgba(29,185,84,0.25), rgba(108,92,231,0.25));
            color: white;
            border: 1px solid rgba(29,185,84,0.3);
        }

        .mood-btn .emoji { font-size: 1.1rem; }

        /* Content area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Playlist header */
        .playlist-header {
            padding: 28px 32px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
        }

        .playlist-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .playlist-header p {
            color: rgba(255,255,255,0.5);
            font-size: 0.88rem;
        }

        /* Spotify CTA */
        .spotify-cta {
            margin: 0 32px 20px;
            background: linear-gradient(135deg, #1db954, #158a3e);
            border-radius: 14px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .spotify-cta .left { display: flex; align-items: center; gap: 12px; }
        .spotify-cta i { font-size: 1.6rem; }
        .spotify-cta .cta-text strong { display: block; font-size: 0.95rem; }
        .spotify-cta .cta-text span   { font-size: 0.78rem; opacity: 0.8; }

        .spotify-cta a {
            background: white;
            color: #1db954;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: transform 0.2s;
        }
        .spotify-cta a:hover { transform: scale(1.04); }

        /* Song list */
        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 32px 120px;
        }

        .song-list::-webkit-scrollbar { width: 4px; }
        .song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.35);
            margin: 20px 0 10px;
        }

        .song-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 6px;
            transition: background 0.15s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .song-card:hover { background: rgba(255,255,255,0.06); }
        .song-card.active {
            background: rgba(29,185,84,0.1);
            border-color: rgba(29,185,84,0.25);
        }

        .song-num {
            width: 20px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.82rem;
        }

        .song-card.active .song-num { color: #1db954; }

        .song-thumb {
            width: 44px; height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .song-info { flex: 1; min-width: 0; }
        .song-info .title {
            font-size: 0.92rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .song-info .artist { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: 2px; }
        .song-card.active .song-info .title { color: #1db954; }

        .song-open {
            background: rgba(29,185,84,0.15);
            border: 1px solid rgba(29,185,84,0.3);
            color: #1db954;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .song-open:hover { background: #1db954; color: black; }

        /* Player bar */

</head>

// Get mood from Flask template variable
const SESSION_MOOD = "{{ mood }}";

let currentMood  = null;
let currentSong  = null;
let currentIndex = 0;

// Build mood sidebar
const moodNav = document.getElementById('moodNav');
Object.keys(PLAYLISTS).filter(k => !k.startsWith('bollywood')).forEach(key => {
    const p = PLAYLISTS[key];
    const btn = document.createElement('button');
    btn.className = 'mood-btn';
    btn.dataset.mood = key;
    btn.innerHTML = `<span class="emoji">${p.emoji}</span> ${p.label.split(' ').slice(1).join(' ')}`;
    btn.onclick = () => loadMood(key);
    moodNav.appendChild(btn);
});

// Build Bollywood sidebar
const bollyNav = document.getElementById('bollyNav');
Object.keys(PLAYLISTS).filter(k => k.startsWith('bollywood')).forEach(key => {
    const p = PLAYLISTS[key];
    const btn = document.createElement('button');
    btn.className = 'mood-btn';
    btn.dataset.mood = key;
    btn.innerHTML = `<span class="emoji">${p.emoji}</span> ${p.label.split(' ').slice(1).join(' ')}`;
    btn.onclick = () => loadMood(key);
    bollyNav.appendChild(btn);
});

// Recommended playlists
const RECOMMENDED = [
    { name: 'Top 50 India',     emoji: '🇮🇳', url: 'https://open.spotify.com/playlist/37i9dQZEVXbLZ52XmnySJg' },

const recNav = document.getElementById('recNav');
RECOMMENDED.forEach(r => {
    const btn = document.createElement('a');
    btn.href   = r.url;
    btn.target = '_blank';
    btn.className = 'mood-btn';
    btn.style.textDecoration = 'none';
    btn.innerHTML = `<span class="emoji">${r.emoji}</span> ${r.name}`;
    recNav.appendChild(btn);
});

function loadMood(moodKey) {
    const p = PLAYLISTS[moodKey];
    if (!p) return;
    currentMood = moodKey;

    // Update sidebar
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`.mood-btn[data-mood="${moodKey}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    // Update header
    document.getElementById('playlistTitle').textContent = `${p.emoji} ${p.playlistName}`;
    document.getElementById('playlistSub').textContent    = p.description;
    document.getElementById('moodBadge').textContent      = `Mood: ${p.label}`;

    // Spotify CTA
    const cta = document.getElementById('spotifyCTA');
    cta.style.display = 'flex';
    document.getElementById('spotifyLink').href = p.spotifyPlaylist;

    // Song list
    const list = document.getElementById('songList');
    list.innerHTML = `<div class="section-title">Recommended for you · ${p.songs.length} tracks</div>`;

    p.songs.forEach((song, i) => {
        const div = document.createElement('div');
        div.className = 'song-card';
        div.dataset.index = i;
        div.innerHTML = `
            <span class="song-num">${i + 1}</span>
            <div class="song-thumb">${song.emoji}</div>
            <div class="song-info">
                <div class="title">${song.title}</div>
                <div class="artist">${song.artist}</div>
            </div>
            <a class="song-open" href="${song.spotify}" target="_blank">
                <i class="fab fa-spotify"></i> Open
            </a>
        `;
        div.addEventListener('click', e => {
            if (e.target.closest('.song-open')) return;
            playSongAt(i);
        });
        list.appendChild(div);
    });
}

function playSongAt(index) {
    const songs = PLAYLISTS[currentMood]?.songs;
    if (!songs) return;
    currentIndex = index;
    const song = songs[index];
    currentSong = song;

    // Update now-playing
    document.getElementById('nowThumb').textContent  = song.emoji;
    document.getElementById('nowTrack').textContent  = song.title;
    document.getElementById('nowArtist').textContent = song.artist;

    // Highlight active
    document.querySelectorAll('.song-card').forEach((c, i) => {
        c.classList.toggle('active', i === index);
    });

    // Play audio if src available
    if (song.src) {
        audio.src = song.src;
        audio.play();
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
    } else {
        // No local src — open on Spotify
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
    }
}

// Controls
document.getElementById('playBtn').addEventListener('click', () => {
    if (!currentSong) return;
    if (currentSong.src) {
        if (audio.paused) {
            audio.play();
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            audio.pause();
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
        }
    } else if (currentSong) {
        window.open(currentSong.spotify, '_blank');
    }
});

document.getElementById('nextBtn').addEventListener('click', () => {
    const songs = PLAYLISTS[currentMood]?.songs;
    if (!songs) return;
    playSongAt((currentIndex + 1) % songs.length);
});

document.getElementById('prevBtn').addEventListener('click', () => {
    const songs = PLAYLISTS[currentMood]?.songs;
    if (!songs) return;
    playSongAt((currentIndex - 1 + songs.length) % songs.length);
});

document.getElementById('volSlider').addEventListener('input', e => {
    audio.volume = e.target.value / 100;
});

// Progress
audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('curTime').textContent = fmt(audio.currentTime);
    document.getElementById('durTime').textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => {
    const songs = PLAYLISTS[currentMood]?.songs;
    if (songs) playSongAt((currentIndex + 1) % songs.length);
});

document.getElementById('progressTrack').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
}

// Auto-load session mood on page open
window.addEventListener('DOMContentLoaded', () => {
    const mood = SESSION_MOOD && PLAYLISTS[SESSION_MOOD] ? SESSION_MOOD : 'happy';
    loadMood(mood);
});
</script>
