<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --text-main: #ffffff;
            --text-muted: #b2b2b2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* ✨ Sparkle Stars Background */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #fff, 0 0 20px var(--primary-color); }
        }

        /* Main Container */
        .music-player {
            width: 900px;
            height: 600px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(108, 92, 231, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .playlist-sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
        }

        .app-logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .playlist-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-btn:hover, .playlist-btn.active {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.5);
        }

        .playlist-btn .emoji {
            font-size: 18px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .playlist-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .playlist-count {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .song-list::-webkit-scrollbar {
            width: 5px;
        }
        .song-list::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 5px;
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: 0.2s;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .song-item.playing {
            background: linear-gradient(90deg, rgba(108, 92, 231, 0.4), transparent);
            border-left: 4px solid var(--secondary-color);
        }

        .song-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        
        .song-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .song-duration {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Player Controls */
        .player-controls {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-info {
            text-align: center;
        }

        .track-title {
            font-size: 18px;
            font-weight: bold;
        }

        .track-artist {
            font-size: 14px;
            color: var(--secondary-color);
        }

        .progress-area {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 5px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -3px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-color);
            opacity: 0;
            transition: 0.2s;
        }

        .progress-area:hover .progress-bar::after {
            opacity: 1;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            color: var(--secondary-color);
            transform: scale(1.1);
        }

        .btn-big {
            font-size: 40px;
            color: var(--primary-color);
        }

        .btn-big:hover {
            color: var(--secondary-color);
        }

        .volume-container {
            position: absolute;
            right: 30px;
            bottom: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .music-player {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                flex-direction: column;
            }
            .playlist-sidebar {
                width: 100%;
                height: 70px;
                flex-direction: row;
                overflow-x: auto;
                padding: 0 10px;
            }
            .app-logo, .playlist-header { display: none; }
            .playlist-btn {
                white-space: nowrap;
                margin-bottom: 0;
                font-size: 13px;
                padding: 8px 12px;
            }
        }

    </style>
</head>

            <div class="song-list" id="songList">

            </div>

            <!-- Player Controls -->

                <div class="progress-area" id="progressArea">

                </div>
                <div class="time-info">

                    <span id="totalDuration">0:00</span>
                </div>

                <div class="controls">

                    <button class="btn" id="nextBtn"><i class="fas fa-forward"></i></button>

                <div class="volume-container">

                    <input type="range" min="0" max="100" value="100" id="volumeSlider" style="width: 80px;">
                </div>
            </div>
        </div>
    </div>
