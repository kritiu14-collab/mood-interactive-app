<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace | Mood Interactive To-Do</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* Lighter Aesthetic Pastel Palette */
            --primary-gradient: linear-gradient(-45deg, #FFDEE9, #B5FFFC, #E0C3FC, #fdfcfb);
            --accent-color: #a18cd1;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-dark: #57606f;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary-gradient);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 25px;
        }

        h1, h2, h3 { color: #6a5acd; font-weight: 600; margin-bottom: 20px; }

        .task-form input, .task-form textarea, .task-form select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.3);
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(161, 140, 209, 0.5); }

        /* Task Item Styling */
        .task-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 12px;
            transition: 0.3s;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .task-card:hover { background: white; transform: translateX(5px); }

        .task-content { flex-grow: 1; margin: 0 15px; }
        
        .completed span { text-decoration: line-through; color: #aaa; }

        .delete-btn { color: #ff7675; cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { color: #d63031; transform: scale(1.1); }

        input[type="checkbox"] { accent-color: #a18cd1; width: 18px; height: 18px; cursor: pointer; }

        aside.glass-card {
            display: flex;
            flex-direction: column;
            max-height: 92vh;
            overflow-y: auto;
        }

        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div style="max-width:1200px;margin:0 auto;padding:16px 20px 0;"><a href="/dashboard" style="color:#a18cd1;text-decoration:none;font-family:Poppins,sans-serif;font-size:0.85rem;font-weight:600;"><i class="fas fa-arrow-left" style="margin-right:6px"></i> Back to Dashboard</a></div>
<h1 style="margin-bottom: 10px;">✨ Solace Tasks</h1>

<div class="main-container">
    <aside class="glass-card">
        <h2><i class="fas fa-plus-circle"></i> New Task</h2>
        <form id="taskForm" class="task-form">
            <input type="text" id="title" placeholder="Task title..." required>
            <textarea id="description" placeholder="Notes (optional)" rows="2"></textarea>
            
            <div style="display: flex; gap: 10px;">
                <input type="date" id="task_date" required>
                <input type="time" id="task_time" required>
            </div>

            <select id="task_type">
                <option value="daily">📅 Daily Task</option>
                <option value="weekly">📆 Weekly Task</option>
            </select>

            <button type="submit" class="btn-submit" id="submitBtn">
                ✦ Add to List
            </button>
        </form>
    </aside>

    <main class="task-list-container">
        <section class="glass-card" style="margin-bottom: 20px;">
            <h3><i class="fas fa-sun"></i> Daily Tasks</h3>
            <div id="daily-tasks">
                <p style="color:#bbb;font-size:0.85rem;">No daily tasks yet. Add one!</p>
                </div>
        </section>

        <section class="glass-card">
            <h3><i class="fas fa-calendar-alt"></i> Weekly Tasks</h3>
            <div id="weekly-tasks">
                <p style="color:#bbb;font-size:0.85rem;">No weekly tasks yet. Add one!</p>
                </div>
        </section>
    </main>
</div>

<script>
    // Load tasks on page load
    document.addEventListener('DOMContentLoaded', loadTasks);

    // 1. Function to Fetch Tasks from Database
    async function loadTasks() {
        try {
            const response = await fetch('/todo_data');
            const tasks = await response.json();
            
            const dailyDiv = document.getElementById('daily-tasks');
            const weeklyDiv = document.getElementById('weekly-tasks');
            
            dailyDiv.innerHTML = '';
            weeklyDiv.innerHTML = '';

            if (tasks.length === 0) {
                dailyDiv.innerHTML = '<p style="color:#999; font-size:0.9rem;">No tasks yet. Add one!</p>';
            }

            tasks.forEach(task => {
                const isCompleted = task.status === 1;
                const taskHTML = `
                    <div class="task-card ${isCompleted ? 'completed' : ''}">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} 
                               onchange="toggleTask(${task.id})">
                        <div class="task-content">
                            <span>${task.title}</span>
                            <br><small><i class="far fa-clock"></i> ${task.task_time} | ${task.task_date}</small>
                        </div>
                        <i class="fas fa-trash-alt delete-btn" onclick="deleteTask(${task.id})"></i>
                    </div>
                `;
                
                if (task.task_type === 'daily') {
                    dailyDiv.insertAdjacentHTML('beforeend', taskHTML);
                } else {
                    weeklyDiv.insertAdjacentHTML('beforeend', taskHTML);
                }
            });
        } catch (err) {
            console.error("Error loading tasks:", err);
        }
    }

    // 2. Handle Form Submission
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.textContent = "Saving...";
        btn.disabled = true;

        const taskData = {
            title:       document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            date:        document.getElementById('task_date').value,
            time:        document.getElementById('task_time').value,
            type:        document.getElementById('task_type').value,
        };

        try {
            const response = await fetch('/add_task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(taskData)
            });

            if (response.ok) {
                document.getElementById('taskForm').reset();
                loadTasks();
                showToast('Task added! ✓');
            } else {
                showToast('Something went wrong. Try again.');
            }
        } catch (err) {
            showToast('Connection error. Is the server running?');
        } finally {
            btn.textContent = "✦ Add to List";
            btn.disabled = false;
        }
    });

    function showToast(msg) {
        const t = document.createElement('div');
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#6a5acd;color:white;padding:10px 24px;border-radius:20px;font-weight:600;font-size:0.85rem;z-index:999;font-family:Poppins,sans-serif;box-shadow:0 4px 16px rgba(106,90,205,0.4)';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // 3. Toggle Completion
    async function toggleTask(id) {
        await fetch(`/toggle_task/${id}`, { method: 'PUT' });
        loadTasks();
    }

    // 4. Delete Task
    async function deleteTask(id) {
        if(confirm('Delete this task?')) {
            await fetch(`/delete_task/${id}`, { method: 'DELETE' });
            loadTasks();
        }
    }
</script>

</body>
</html>
