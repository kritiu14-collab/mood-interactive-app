<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace | Login & Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 350px;
            max-width: 90%;
            position: relative;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #4a4a4a; }
        form, .forgot-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        form.active, .forgot-section.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group { position: relative; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 5px rgba(102, 126, 234, 0.5); }
        .input-group i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #aaa; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .toggle { text-align: center; margin-bottom: 20px; }
        .toggle a { color: #667eea; text-decoration: none; font-weight: bold; margin: 0 10px; cursor: pointer; }
        .error { color: #e74c3c; font-size: 14px; margin-top: 5px; text-align: center; }
        .success { color: #27ae60; font-size: 14px; margin-top: 5px; text-align: center; }
        .forgot, .back-link { text-align: center; margin-top: 10px; }
        .forgot a, .back-link a { color: #667eea; text-decoration: none; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="toggle">
        <a onclick="showForm('login')">Login</a> | <a onclick="showForm('signup')">Signup</a>
    </div>

    <form id="loginForm">
        <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
        <div class="input-group">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <i class="fas fa-user"></i>
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Password" required>
            <i class="fas fa-lock"></i>
        </div>
        <div id="loginError" class="error"></div>
        <button type="submit">Login</button>
        <div class="forgot">
            <a onclick="showForgotPassword()">Forgot Password?</a>
        </div>
    </form>

    <form id="signupForm">
        <h2><i class="fas fa-user-plus"></i> Signup</h2>
        <div class="input-group">
            <input type="text" id="signupUsername" placeholder="Username" required>
            <i class="fas fa-user"></i>
        </div>
        <div class="input-group">
            <input type="email" id="signupEmail" placeholder="Email" required>
            <i class="fas fa-envelope"></i>
        </div>
        <div class="input-group">
            <input type="password" id="signupPassword" placeholder="Password" required>
            <i class="fas fa-lock"></i>
        </div>
        <div class="input-group">
            <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
            <i class="fas fa-lock"></i>
        </div>
        <div id="signupError" class="error"></div>
        <div id="signupSuccess" class="success"></div>
        <button type="submit">Signup</button>
    </form>

    <div id="forgotSection" class="forgot-section">
        <h2><i class="fas fa-key"></i> Reset</h2>
        <div class="input-group">
            <input type="text" id="forgotUsername" placeholder="Username" required>
            <i class="fas fa-user"></i>
        </div>
        <div id="forgotError" class="error"></div>
        <div id="forgotSuccess" class="success"></div>
        <button type="button" onclick="resetPassword()">Reset Password</button>
        <div class="back-link">
            <a onclick="showForm('login')">Back to Login</a>
        </div>
    </div>
</div>

<script> 
    function showForm(formType) {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('signupForm').classList.remove('active');
        document.getElementById('forgotSection').classList.remove('active');
        if(formType === 'login') document.getElementById('loginForm').classList.add('active');
        else document.getElementById('signupForm').classList.add('active');
        document.querySelectorAll('.error, .success').forEach(el => el.textContent = '');
    }

    function showForgotPassword() {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('signupForm').classList.remove('active');
        document.getElementById('forgotSection').classList.add('active');
    }

    // Initialize
    showForm('login');

    // SIGNUP HANDLER
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('signupUsername').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;

        if (password.length < 8) {
            document.getElementById('signupError').textContent = 'Min 8 characters required.';
            return;
        }
        if (password !== confirmPassword) {
            document.getElementById('signupError').textContent = 'Passwords do not match.';
            return;
        }

        const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });

        const result = await response.json();
        if (response.ok) {
            document.getElementById('signupSuccess').textContent = 'Account created! Loading login...';
            setTimeout(() => showForm('login'), 2000);
        } else {
            document.getElementById('signupError').textContent = result.error;
        }
    });

    // LOGIN HANDLER - CONNECTS TO TRACKER
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        errorDiv.textContent = '';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                // Redirects to /tracker_page as defined in app.py
                window.location.href = result.redirect || '/tracker_page';
            } else {
                errorDiv.textContent = result.error || 'Invalid username or password.';
            }
        } catch (err) {
            errorDiv.textContent = 'Server connection failed.';
        }
    });

    function resetPassword() {
        document.getElementById('forgotSuccess').textContent = 'Contact admin for reset.';
    }
</script>
</body>
</html>
