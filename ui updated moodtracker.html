<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Mood | Solace</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3x3 Grid */
            gap: 20px;
            max-width: 600px;
            width: 90%;
        }

        .mood-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mood-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .label {
            font-size: 1rem;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <h1>How are you feeling today?</h1>
    <p>Your dashboard will adapt to your energy.</p>

    <div class="mood-grid">
        <a href="index.html?mood=happy" class="mood-card">
            <span class="emoji">😊</span>
            <span class="label">Happy</span>
        </a>
        <a href="index.html?mood=sad" class="mood-card">
            <span class="emoji">😞</span>
            <span class="label">Sad</span>
        </a>
        <a href="index.html?mood=stress" class="mood-card">
            <span class="emoji">😫</span>
            <span class="label">Stressed</span>
        </a>
        <a href="index.html?mood=neutral" class="mood-card">
            <span class="emoji">😐</span>
            <span class="label">Neutral</span>
        </a>
        <a href="index.html?mood=gross" class="mood-card">
            <span class="emoji">🤢</span>
            <span class="label">Gross</span>
        </a>
        <a href="index.html?mood=calm" class="mood-card">
            <span class="emoji">😌</span>
            <span class="label">Calm</span>
        </a>
        <a href="index.html?mood=angry" class="mood-card">
            <span class="emoji">😡</span>
            <span class="label">Angry</span>
        </a>
        <a href="index.html?mood=anxious" class="mood-card">
            <span class="emoji">😰</span>
            <span class="label">Anxious</span>
        </a>
        <a href="index.html?mood=tired" class="mood-card">
            <span class="emoji">😴</span>
            <span class="label">Tired</span>
        </a>
    </div>

</body>
</html>
